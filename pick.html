<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>จัดของ — หลีเจ็กตง</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script>
  <style>
    :root {
      --brand:      #C0392B;
      --brand-dark: #922B21;
      --surface:    #FDF6EC;
      --card:       #FFFFFF;
      --text:       #2C1A0E;
      --sub:        #7B6252;
      --border:     #E8D5C4;
      --success:    #1E8449;
      --success-bg: #EAFAF1;
      --success-bd: #A9DFBF;
      --error-bg:   #FDECEA;
      --error-bd:   #F5B7B1;
      --error-text: #922B21;
      --amber:      #E67E22;
      --amber-bg:   #FEF5E7;
      --today-bg:   #FDECEA;
      --radius:     16px;
      --shadow:     0 2px 12px rgba(44,26,14,.10);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, "Noto Sans Thai", "Sarabun", sans-serif;
      background: var(--surface);
      color: var(--text);
      min-height: 100vh;
    }

    /* HEADER */
    .header {
      background: var(--brand);
      padding: 14px 16px;
      display: flex; align-items: center; gap: 10px;
      position: sticky; top: 0; z-index: 100;
    }
    .back-btn {
      background: rgba(255,255,255,.15); border: none;
      border-radius: 8px; width: 34px; height: 34px;
      color: #fff; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
    }
    .header-text { color: #fff; flex:1; min-width:0; }
    .header-text h1 { font-size: 17px; font-weight: 700; }
    .header-text p  { font-size: 11px; opacity: .75; margin-top: 1px; }
    .queue-badge {
      background: rgba(255,255,255,.2);
      border-radius: 20px; padding: 6px 12px;
      color: #fff; font-size: 13px; font-weight: 700;
      white-space: nowrap; flex-shrink: 0;
    }

    /* LOADING */
    .loading-wrap {
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 12px; padding: 64px 24px;
    }
    .loading-ring {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 14px; color: var(--sub); }

    /* EMPTY / DENY */
    .state-msg {
      text-align: center; padding: 64px 32px;
      color: var(--sub); font-size: 15px; line-height: 1.6;
    }
    .state-emoji { font-size: 52px; margin-bottom: 12px; }

    /* ORDER CARD */
    .card-list { padding: 12px 16px 32px; }
    .order-card {
      background: var(--card);
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-bottom: 14px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .order-head {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }
    .order-top {
      display: flex; align-items: center; gap: 8px; margin-bottom: 4px;
    }
    /* 🔴 v11: ป้ายแผนก ครัว/ของแห้ง */
    .dept-row { margin-bottom: 6px; }
    .dept-tag {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 13px; font-weight: 800;
      padding: 4px 12px; border-radius: 8px;
    }
    .dept-tag.kitchen { background: #FDECEA; color: var(--brand); }
    .dept-tag.dry     { background: #EAF2FB; color: #1F5C99; }
    .branch-name { font-size: 15px; font-weight: 800; flex: 1; min-width: 0; }
    .deliver-tag {
      font-size: 12px; font-weight: 700;
      padding: 3px 10px; border-radius: 20px;
      white-space: nowrap; flex-shrink: 0;
    }
    .deliver-tag.today  { background: var(--today-bg); color: var(--brand); }
    .deliver-tag.tmr    { background: var(--surface); color: var(--sub); border: 1px solid var(--border); }
    .order-meta { font-size: 12px; color: var(--sub); }
    .order-note {
      margin-top: 8px; padding: 8px 10px;
      background: var(--amber-bg); border-radius: 8px;
      font-size: 13px; color: var(--brand-dark);
      display: flex; gap: 6px; align-items: flex-start;
    }
    .order-note .warn-ic { flex-shrink: 0; }

    /* ITEM ROW (in card) */
    .pick-item {
      display: flex; align-items: center;
      padding: 9px 14px;
      border-bottom: 1px solid #F4ECE2;
    }
    .pick-item:last-of-type { border-bottom: none; }
    .pick-name { flex: 1; font-size: 14px; min-width: 0; padding-right: 8px; }
    .pick-ordered { font-size: 11px; color: var(--sub); margin-top: 1px; }
    .qty-ctrl { display: flex; align-items: center; flex-shrink: 0; }
    .qty-btn {
      width: 30px; height: 30px; border: none;
      background: var(--surface); color: var(--text);
      font-size: 17px; font-weight: 700;
      border-radius: 8px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .qty-btn:active { background: var(--border); }
    .qty-btn.minus { color: var(--brand); }
    .qty-btn.plus  { color: var(--success); }
    .qty-num {
      min-width: 34px; text-align: center;
      font-size: 15px; font-weight: 800;
    }
    .qty-num.short { color: var(--amber); }

    /* CARD FOOTER */
    .card-foot { padding: 12px 14px; }
    .pick-btn {
      width: 100%; padding: 13px;
      font-size: 15px; font-weight: 800;
      background: var(--success); color: #fff;
      border: none; border-radius: 12px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: opacity .15s, transform .1s;
    }
    .pick-btn:active:not(:disabled) { transform: scale(.98); }
    .pick-btn:disabled { opacity: .5; cursor: not-allowed; }
    .mini-spin {
      width: 16px; height: 16px;
      border: 2.5px solid rgba(255,255,255,.3);
      border-top-color: #fff; border-radius: 50%;
      animation: spin .7s linear infinite; display: none;
    }

    /* TOAST */
    .toast {
      position: fixed; left: 50%; bottom: 28px;
      transform: translateX(-50%) translateY(20px);
      background: var(--text); color: #fff;
      padding: 12px 20px; border-radius: 24px;
      font-size: 14px; font-weight: 600;
      opacity: 0; pointer-events: none;
      transition: opacity .25s, transform .25s;
      z-index: 300; max-width: 88%; text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.err { background: var(--error-text); }
  </style>
</head>
<body>

<script>
  var LIFF_ID       = '2010362712-uGq1XJQ6';
  var WEB_APP_URL   = 'https://script.google.com/macros/s/AKfycbzC_IDcWumwKzkHKRjBFhsFsugV43eHx7tpC4ngOdelBLmClZBvdiAQJQ0by6q6V2jqRQ/exec';
  var SHARED_SECRET = 'LJT_8f3Kq9mZx2Wp5Rv7Nt4Hy6Bc1Ds0Ga';
  var PICK_BRANCH_ID = 15;   // ร้านหลัก (ครัวกลาง)
</script>

<!-- HEADER -->
<div class="header">
  <button class="back-btn" onclick="history.back()">←</button>
  <div class="header-text">
    <h1>จัดของ</h1>
    <p id="headerSub">โหลด...</p>
  </div>
  <div class="queue-badge" id="queueBadge">—</div>
</div>

<!-- LOADING -->
<div class="loading-wrap" id="loadingWrap">
  <div class="loading-ring"></div>
  <div class="loading-text">กำลังโหลดคิว...</div>
</div>

<!-- CONTENT (injected) -->
<div id="content" style="display:none"></div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
(function() {
  var uid = null;
  var orders = [];            // จาก backend
  // qtyState[order_id][item_id] = qty_delivered (ค่าที่คนจัดติ๊ก)
  var qtyState = {};
  var locked = {};            // order_id -> true (กันกดซ้ำระหว่างส่ง)

  function el(id) { return document.getElementById(id); }

  function callGAS(body) {
    return fetch(WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ token: SHARED_SECRET, userId: uid }, body))
    }).then(function(r){ return r.json(); });
  }

  function toast(msg, isErr) {
    var t = el('toast');
    t.textContent = msg;
    t.className = 'toast show' + (isErr ? ' err' : '');
    setTimeout(function(){ t.className = 'toast' + (isErr ? ' err' : ''); }, 2600);
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }

  // ── DENY (ไม่มีสิทธิ์) ──
  function showDeny() {
    el('loadingWrap').style.display = 'none';
    el('headerSub').textContent = '';
    el('queueBadge').textContent = '—';
    var c = el('content');
    c.style.display = 'block';
    c.innerHTML =
      '<div class="state-msg">' +
        '<div class="state-emoji">🔒</div>' +
        'หน้านี้สำหรับครัวกลาง (ร้านหลัก) เท่านั้น<br>' +
        'ถ้าคิดว่าผิดพลาด ติดต่อมิ้งค์' +
      '</div>';
  }

  // ── RENDER QUEUE ──
  function renderQueue() {
    var c = el('content');
    el('loadingWrap').style.display = 'none';
    c.style.display = 'block';

    if (!orders.length) {
      el('queueBadge').textContent = '0 คิว';
      c.innerHTML =
        '<div class="state-msg">' +
          '<div class="state-emoji">✅</div>' +
          'ไม่มีออเดอร์ค้างจัด<br>เคลียร์หมดแล้ว' +
        '</div>';
      return;
    }

    el('queueBadge').textContent = orders.length + ' คิว';

    var html = '<div class="card-list">';
    orders.forEach(function(o) {
      qtyState[o.order_id] = qtyState[o.order_id] || {};
      var isToday = o.is_today;
      html +=
        '<div class="order-card" id="card-' + esc(o.order_id) + '">' +
          '<div class="order-head">' +
            '<div class="dept-row">' +
              '<span class="dept-tag ' + (o.category === 'kitchen' ? 'kitchen' : 'dry') + '">' +
                esc(o.dept_icon) + ' ' + esc(o.dept_label) +
              '</span>' +
            '</div>' +
            '<div class="order-top">' +
              '<span class="branch-name">' + esc(o.branch_name) + '</span>' +
              '<span class="deliver-tag ' + (isToday ? 'today' : 'tmr') + '">' +
                'ส่ง' + esc(o.deliver_label) + ' ' + esc(o.deliver_disp) +
              '</span>' +
            '</div>' +
            '<div class="order-meta">โดย ' + esc(o.name) + ' • ' + o.item_count + ' รายการ</div>';
      if (o.note) {
        html +=
            '<div class="order-note">' +
              '<span class="warn-ic">⚠️</span>' +
              '<span>' + esc(o.note) + '</span>' +
            '</div>';
      }
      html += '</div>';  // order-head

      // items
      o.items.forEach(function(it) {
        var iid = it.item_id;
        // default qty_delivered = qty ที่สั่ง
        if (qtyState[o.order_id][iid] === undefined) {
          qtyState[o.order_id][iid] = it.qty;
        }
        var cur = qtyState[o.order_id][iid];
        html +=
          '<div class="pick-item">' +
            '<div class="pick-name">' + esc(it.item_name) +
              '<div class="pick-ordered">สั่ง ' + it.qty + '</div>' +
            '</div>' +
            '<div class="qty-ctrl">' +
              '<button class="qty-btn minus" onclick="pickQty(\'' + esc(o.order_id) + '\',' + iid + ',-0.5,' + it.qty + ')">−</button>' +
              '<span class="qty-num' + (cur < it.qty ? ' short' : '') + '" id="q-' + esc(o.order_id) + '-' + iid + '">' + cur + '</span>' +
              '<button class="qty-btn plus" onclick="pickQty(\'' + esc(o.order_id) + '\',' + iid + ',0.5,' + it.qty + ')">+</button>' +
            '</div>' +
          '</div>';
      });

      html +=
          '<div class="card-foot">' +
            '<button class="pick-btn" id="btn-' + esc(o.order_id) + '" onclick="doPick(\'' + esc(o.order_id) + '\')">' +
              '<span class="mini-spin" id="spin-' + esc(o.order_id) + '"></span>' +
              '<span>✓ จัดเสร็จแล้ว</span>' +
            '</button>' +
          '</div>' +
        '</div>';  // order-card
    });
    html += '</div>';
    c.innerHTML = html;
  }

  // ── QTY CHANGE ──
  window.pickQty = function(orderId, itemId, delta, ordered) {
    var cur = qtyState[orderId][itemId];
    var next = cur + delta;
    if (next < 0) next = 0;
    if (next > 50) next = 50;
    next = Math.round(next * 2) / 2;   // ล็อกเป็นขั้น 0.5 กัน float เพี้ยน
    qtyState[orderId][itemId] = next;
    var span = el('q-' + orderId + '-' + itemId);
    if (span) {
      span.textContent = next;
      if (next < ordered) span.classList.add('short');
      else span.classList.remove('short');
    }
  };

  // ── DO PICK (จัดเสร็จ) ──
  window.doPick = function(orderId) {
    if (locked[orderId]) return;
    locked[orderId] = true;

    var btn  = el('btn-' + orderId);
    var spin = el('spin-' + orderId);
    if (btn)  btn.disabled = true;
    if (spin) spin.style.display = 'block';

    var items = Object.keys(qtyState[orderId]).map(function(iid) {
      return { item_id: Number(iid), qty_delivered: qtyState[orderId][iid] };
    });

    callGAS({ action: 'submitPick', order_id: orderId, items: items })
      .then(function(data) {
        if (data.ok) {
          // เอาการ์ดออกจากหน้า + update badge
          var card = el('card-' + orderId);
          if (card) card.parentNode.removeChild(card);
          orders = orders.filter(function(o){ return o.order_id !== orderId; });
          el('queueBadge').textContent = orders.length + ' คิว';
          toast('จัดเสร็จแล้ว — แจ้งสาขาเรียบร้อย');
          if (!orders.length) renderQueue();  // โชว์ empty state
        } else {
          locked[orderId] = false;
          if (btn)  btn.disabled = false;
          if (spin) spin.style.display = 'none';
          var msgs = {
            ALREADY_PICKED: 'ออเดอร์นี้ถูกจัดไปแล้ว (โหลดใหม่)',
            ORDER_NOT_FOUND:'ไม่พบออเดอร์ (โหลดใหม่)',
            BUSY_TRY_AGAIN: 'ระบบยุ่ง ลองใหม่อีกครั้ง',
            UNAUTHORIZED:   'ไม่ได้รับอนุญาต',
          };
          toast(msgs[data.error] || ('ผิดพลาด: ' + data.error), true);
        }
      })
      .catch(function() {
        locked[orderId] = false;
        if (btn)  btn.disabled = false;
        if (spin) spin.style.display = 'none';
        toast('เชื่อมต่อไม่ได้ ลองใหม่', true);
      });
  };

  // ── LOAD QUEUE ──
  function loadQueue() {
    return callGAS({ action: 'getPickQueue' }).then(function(data) {
      if (data && data.ok) {
        orders = data.orders || [];
        renderQueue();
      } else {
        el('loadingWrap').innerHTML =
          '<div class="state-msg"><div class="state-emoji">❌</div>' +
          'โหลดคิวไม่ได้<br><small>' + esc((data && data.error) || '') + '</small></div>';
      }
    });
  }

  // ── INIT ──
  liff.init({ liffId: LIFF_ID })
    .then(function() {
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
      return liff.getProfile();
    })
    .then(function(profile) {
      if (!profile) return;
      uid = profile.userId;
      return callGAS({ action: 'getProfile' });
    })
    .then(function(pData) {
      if (!pData) return;
      if (!pData.ok) {
        el('loadingWrap').innerHTML =
          '<div class="state-msg"><div class="state-emoji">❌</div>' +
          'ไม่พบข้อมูลพนักงาน<br>ติดต่อมิ้งค์</div>';
        return;
      }
      var emp = pData.employee;
      el('headerSub').textContent = emp.name;

      // ── GUARD สิทธิ์: branch_id 15 (ร้านหลัก) หรือ super_admin ──
      var allowed = (Number(emp.branch_id) === PICK_BRANCH_ID) || (emp.role === 'super_admin');
      if (!allowed) { showDeny(); return; }

      return loadQueue();
    })
    .catch(function(e) {
      console.error(e);
      el('loadingWrap').innerHTML =
        '<div class="state-msg"><div class="state-emoji">❌</div>' +
        'เชื่อมต่อไม่ได้<br><small>ปิดแล้วเปิดใหม่ใน LINE</small></div>';
    });
})();
</script>
</body>
</html>
