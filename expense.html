<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เบิกเงิน</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root { --green:#06C755; --red:#E53935; --bg:#f5f6f8; --line:#e3e6ea; --ink:#1a1a1a; --mute:#7a8290; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system,"Helvetica Neue","Noto Sans Thai","Sarabun",sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:480px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:20px; margin:8px 0 20px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px; }
  label { display:block; font-size:14px; color:var(--mute); margin:14px 0 6px; }
  label:first-child { margin-top:0; }
  input, textarea { width:100%; border:1px solid var(--line); border-radius:10px; padding:12px; font-size:16px; font-family:inherit; }
  input:focus, textarea:focus { outline:none; border-color:var(--green); }
  textarea { min-height:84px; resize:vertical; }
  .amt { font-size:22px; font-weight:700; text-align:center; }
  button { width:100%; margin-top:20px; padding:15px; border:0; border-radius:12px; background:var(--green); color:#fff; font-size:17px; font-weight:600; }
  button:disabled { background:#b9c0c9; }
  .msg { margin-top:16px; padding:12px 14px; border-radius:10px; font-size:14px; display:none; }
  .msg.ok { background:#e7f8ee; color:#127a3e; display:block; }
  .msg.err { background:#fdecec; color:#b32020; display:block; }
  .hint { font-size:12px; color:var(--mute); margin-top:6px; }
  .center { text-align:center; color:var(--mute); padding:40px 0; }
  /* v21 */
  .home-link { display:inline-block; font-size:14px; font-weight:600; color:#05a948; text-decoration:none; padding:4px 0; }
  .quick { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:10px; }
  .quick button { margin:0; padding:11px 0; font-size:15px; background:#fff; color:var(--ink); border:1.5px solid var(--line); border-radius:10px; font-weight:700; }
  .quick button:active { background:#eef8f1; }
  .cf-overlay { position:fixed; inset:0; background:rgba(26,26,26,.55); display:none; align-items:flex-start; justify-content:center; padding:14vh 20px 0; z-index:50; }
  .cf-box { background:#fff; border-radius:18px; padding:22px 18px 14px; width:100%; max-width:360px; text-align:center; }
  .cf-k { font-size:14px; color:var(--mute); }
  .cf-amt { font-size:40px; font-weight:800; margin:4px 0 2px; letter-spacing:.5px; }
  .cf-words { font-size:14px; color:var(--mute); margin-bottom:6px; }
  .cf-reason { font-size:14px; margin-bottom:6px; word-break:break-word; }
  .cf-box .ghost { background:transparent; color:var(--mute); margin-top:4px; }
</style>
</head>
<body>
<div class="wrap">
  <a class="home-link" href="index.html">‹ หน้าแรก</a>
  <h1>เบิกเงินล่วงหน้า</h1>
  <div id="loading" class="center">กำลังโหลด…</div>

  <div id="form" class="card" style="display:none;">
    <label>จำนวนเงิน (บาท)</label>
    <input id="amount" class="amt" type="text" inputmode="numeric" autocomplete="off" placeholder="0">
    <div class="quick">
      <button type="button" data-v="500">500</button>
      <button type="button" data-v="1000">1,000</button>
      <button type="button" data-v="2000">2,000</button>
      <button type="button" data-v="3000">3,000</button>
    </div>
    <label>เหตุผล (ไม่บังคับ)</label>
    <textarea id="reason" placeholder="เว้นว่างได้"></textarea>
    <div class="hint">* ส่งได้ครั้งละ 1 คำขอ ต้องรอผลก่อนส่งใหม่</div>
    <button id="submit">ส่งคำขอ</button>
    <div id="msg" class="msg"></div>
  </div>
</div>

<!-- v21: ยืนยันยอดตัวใหญ่ก่อนส่ง (เคยพิมพ์ 300 แทน 3,000) -->
<div class="cf-overlay" id="cf">
  <div class="cf-box">
    <div class="cf-k">ยืนยันขอเบิก</div>
    <div class="cf-amt" id="cfAmt">0</div>
    <div class="cf-words">บาท</div>
    <div class="cf-reason" id="cfReason"></div>
    <button id="cfOk">ยืนยัน ส่งคำขอ</button>
    <button class="ghost" id="cfNo" type="button">แก้ไขยอด</button>
  </div>
</div>

<script>
  var LIFF_ID       = "2010362712-uGq1XJQ6";
  var GAS_URL       = "https://script.google.com/macros/s/AKfycbzC_IDcWumwKzkHKRjBFhsFsugV43eHx7tpC4ngOdelBLmClZBvdiAQJQ0by6q6V2jqRQ/exec";
  var SHARED_SECRET = "LJT_8f3Kq9mZx2Wp5Rv7Nt4Hy6Bc1Ds0Ga";

  var USER_ID = null;

  function $(id){ return document.getElementById(id); }
  function showMsg(text, ok){
    var m = $("msg");
    m.textContent = text;
    m.className = "msg " + (ok ? "ok" : "err");
  }

  async function init(){
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
      var prof = await liff.getProfile();
      USER_ID = prof.userId;
      $("loading").style.display = "none";
      $("form").style.display = "block";
    } catch (e) {
      $("loading").textContent = "เปิดผ่านเมนูใน LINE เท่านั้น";
    }
  }

  // v21: ใส่ลูกน้ำขณะพิมพ์
  function amountValue(){ return Number(String($("amount").value).replace(/[^0-9]/g, "")) || 0; }
  function setAmount(n){ $("amount").value = n ? Number(n).toLocaleString("en-US") : ""; }
  $("amount").addEventListener("input", function(){
    var raw = String($("amount").value).replace(/[^0-9]/g, "").slice(0, 6);
    setAmount(raw ? Number(raw) : 0);
  });
  Array.prototype.forEach.call(document.querySelectorAll(".quick button"), function(b){
    b.addEventListener("click", function(){ setAmount(Number(b.getAttribute("data-v"))); });
  });

  var ERR_TH = {
    HAS_PENDING: "มีคำขอที่รออนุมัติอยู่ — รอผลก่อนส่งใหม่",
    USER_NOT_FOUND: "ไม่พบบัญชีพนักงานในระบบ ติดต่อมิ้งค์",
    BAD_AMOUNT: "จำนวนเงินไม่ถูกต้อง"
  };

  function submit(){
    var amount = amountValue();
    if (!(amount >= 1)) { showMsg("กรุณากรอกจำนวนเงิน", false); return; }
    $("cfAmt").textContent = amount.toLocaleString("en-US");
    var reason = $("reason").value.trim();
    $("cfReason").textContent = reason ? ("เหตุผล: " + reason) : "";
    $("cf").style.display = "flex";
  }
  $("cfNo").addEventListener("click", function(){ $("cf").style.display = "none"; $("amount").focus(); });
  $("cfOk").addEventListener("click", function(){ $("cf").style.display = "none"; send(); });

  async function send(){
    var amount = amountValue();
    var reason = $("reason").value.trim();
    var btn = $("submit");
    btn.disabled = true; btn.textContent = "กำลังส่ง…";
    try {
      var ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
      var t = setTimeout(function(){ if (ctrl) ctrl.abort(); }, 30000);
      var res = await fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({
          token: SHARED_SECRET,
          action: "submitExpense",
          userId: USER_ID,
          amount: amount,
          reason: reason
        }),
        signal: ctrl ? ctrl.signal : undefined
      });
      clearTimeout(t);
      var data = await res.json();
      if (data.ok) {
        showMsg("✅ " + (data.message || "ส่งคำขอแล้ว รอการอนุมัติ"), true);
        $("amount").value = ""; $("reason").value = "";
      } else {
        showMsg("❌ " + (ERR_TH[data.error] || data.message || data.error || "ส่งไม่สำเร็จ"), false);
      }
    } catch (e) {
      var d = (e && e.name === "AbortError") ? "หมดเวลา" : (e && e.message ? e.message : e);
      showMsg("❌ เชื่อมต่อไม่สำเร็จ [" + d + "] — ถ้ากดใหม่แล้วขึ้น 'รออนุมัติอยู่' แปลว่าส่งไปแล้ว", false);
    } finally {
      btn.disabled = false; btn.textContent = "ส่งคำขอ";
    }
  }

  $("submit").addEventListener("click", submit);
  init();
</script>
</body>
</html>
