<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ผลตรวจสาขา</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root { --green:#06C755; --red:#E53935; --bg:#f5f6f8; --line:#e3e6ea; --ink:#1a1a1a; --mute:#7a8290; --blue:#3b6fd4;
          --green-bg:#eef9f1; --green-ink:#127a3e; --red-bg:#fdecec; --red-ink:#b32020; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system,"Helvetica Neue","Noto Sans Thai","Sarabun",sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:480px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:20px; margin:8px 0 16px; }
  .center { text-align:center; color:var(--mute); padding:40px 0; }

  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:18px; }
  .card-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; }
  .card-title { font-size:16px; font-weight:700; }
  .card-tag { font-size:11px; color:var(--mute); }

  /* View 1 — feed */
  .feedrow { padding:12px 0; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
  .feedrow:last-of-type { border-bottom:0; }
  .feed-date { font-size:17px; font-weight:700; }
  .feed-by { font-size:13px; color:var(--mute); margin-top:2px; }
  .feed-meta { font-size:12px; margin-top:4px; display:flex; gap:8px; flex-wrap:wrap; }
  .mp { color:var(--green-ink); font-weight:600; }
  .mf { color:var(--red-ink); font-weight:600; }
  .mc { color:var(--mute); }
  .feed-right { display:flex; align-items:center; gap:8px; flex-shrink:0; margin-left:10px; }
  .branch-badge { font-size:12px; padding:4px 11px; border-radius:20px; background:#eef3fb; color:var(--blue); font-weight:600; }
  .caret { color:var(--mute); font-size:12px; transition:transform .15s; }
  .caret.open { transform:rotate(90deg); }

  /* detail panel */
  .detail { display:none; padding:4px 0 16px; border-bottom:1px solid var(--line); }
  .detail.open { display:block; }
  .dloading { color:var(--mute); font-size:13px; padding:10px 0; }
  .dnote { background:#f7f8fa; border-radius:10px; padding:11px 13px; font-size:13px; line-height:1.5; margin-bottom:12px; white-space:pre-line; }
  .ditem { padding:10px 0; border-bottom:1px dashed var(--line); }
  .ditem:last-child { border-bottom:0; }
  .drow { display:flex; align-items:flex-start; gap:9px; }
  .dmark { font-size:14px; flex-shrink:0; width:19px; text-align:center; line-height:1.4; }
  .dmark.ok { color:var(--green-ink); }
  .dmark.no { color:var(--red-ink); }
  .dlabel { font-size:14px; line-height:1.4; flex:1; }
  .ditem.fail .dlabel { color:var(--red-ink); font-weight:600; }
  .dphotos { display:flex; gap:8px; flex-wrap:wrap; margin:9px 0 2px 28px; }
  .ph { width:78px; height:78px; border-radius:9px; overflow:hidden; border:1px solid var(--line); background:#fff; padding:0; cursor:pointer; display:block; }
  .ph img { width:100%; height:100%; object-fit:cover; display:block; }
  .ph-fb { width:auto; height:auto; padding:7px 12px; font-size:12px; font-family:inherit; color:var(--blue);
           background:#eef3fb; border:1px solid #cfe0f5; border-radius:9px; cursor:pointer; }
  .nophoto { font-size:12px; color:var(--mute); margin:7px 0 2px 28px; }
  .loadmore { width:100%; margin-top:12px; padding:11px; font-family:inherit; font-size:14px; font-weight:600;
              color:var(--blue); background:#eef3fb; border:1px solid #cfe0f5; border-radius:10px; cursor:pointer; }

  /* View 2 */
  .counters { display:flex; gap:18px; font-size:13px; margin-bottom:12px; padding:0 2px; }
  .counters .ct { display:flex; align-items:center; gap:6px; }
  .ct-dot { width:9px; height:9px; border-radius:50%; }
  .ct-dot.g { background:var(--green); }
  .ct-dot.r { background:var(--red); }
  .brow { display:flex; justify-content:space-between; align-items:center; padding:11px 13px; border-radius:10px; margin-bottom:7px; }
  .brow:last-child { margin-bottom:0; }
  .brow.ok  { background:var(--green-bg); }
  .brow.no  { background:var(--red-bg); }
  .bname { font-size:14px; font-weight:600; }
  .brow.ok .bname { color:var(--green-ink); }
  .brow.no .bname { color:var(--red-ink); }
  .bright { font-size:13px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .bcount { color:var(--green-ink); font-weight:600; }
  .chip { font-size:11px; background:#fff; border:1px solid #cdeed8; color:var(--green-ink); border-radius:14px; padding:2px 8px; }
  .bno { color:var(--red-ink); font-size:13px; }
  .emptybox { color:var(--mute); font-size:14px; text-align:center; padding:18px 0; }

  /* lightbox */
  #lb { display:none; position:fixed; inset:0; background:rgba(0,0,0,.86); z-index:99; padding:16px; }
  #lb.open { display:flex; flex-direction:column; }
  #lb iframe { flex:1; width:100%; border:0; border-radius:10px; background:#111; }
  #lbclose { align-self:flex-end; margin-bottom:10px; background:#fff; color:var(--ink); border:0;
             border-radius:20px; padding:8px 18px; font-family:inherit; font-size:14px; font-weight:600; cursor:pointer; }
</style>
</head>
<body>
<div class="wrap">
  <h1>ผลตรวจสาขา</h1>
  <div id="loading" class="center">กำลังโหลด…</div>

  <div id="content" style="display:none;">

    <!-- View 1 — ประวัติการตรวจ -->
    <div class="card">
      <div class="card-head">
        <span class="card-title">🕘 ประวัติการตรวจ</span>
        <span class="card-tag" id="feedTag"></span>
      </div>
      <div id="feed"></div>
    </div>

    <!-- View 2 — สถานะเดือนนี้ -->
    <div class="card">
      <div class="card-head">
        <span class="card-title">📍 สถานะเดือนนี้</span>
        <span class="card-tag" id="monthTag"></span>
      </div>
      <div class="counters">
        <span class="ct"><span class="ct-dot g"></span>ตรวจแล้ว <b id="ctChecked">0</b></span>
        <span class="ct"><span class="ct-dot r"></span>ตกหล่น <b id="ctMissed">0</b></span>
      </div>
      <div id="status"></div>
    </div>

  </div>
</div>

<div id="lb">
  <button id="lbclose" onclick="closeLb()">ปิด ✕</button>
  <iframe id="lbframe" src="" allow="autoplay"></iframe>
</div>

<script>
  var LIFF_ID       = "2010362712-uGq1XJQ6";
  var GAS_URL       = "https://script.google.com/macros/s/AKfycbzC_IDcWumwKzkHKRjBFhsFsugV43eHx7tpC4ngOdelBLmClZBvdiAQJQ0by6q6V2jqRQ/exec";
  var SHARED_SECRET = "LJT_8f3Kq9mZx2Wp5Rv7Nt4Hy6Bc1Ds0Ga";

  var USER_ID   = null;
  var FEED_SHOWN = 20;      // แสดงกี่รอบก่อน
  var FEED_STEP  = 20;
  var FEED_ALL   = [];
  var CACHE     = {};       // inspection_id -> detail (กันยิงซ้ำตอนกดปิด-เปิด)

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }

  function call(payload){
    payload.token = SHARED_SECRET;
    payload.userId = USER_ID;
    return fetch(GAS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    }).then(function(r){ return r.json(); });
  }

  // ดึง fileId ออกจาก URL ที่ backend เก็บไว้ (.../file/d/<ID>/preview)
  function driveId(url){
    var m = String(url).match(/\/d\/([^\/?#]+)/);
    return m ? m[1] : "";
  }

  function init(){
    liff.init({ liffId: LIFF_ID }).then(function(){
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return new Promise(function(){}); }
      return liff.getProfile();
    }).then(function(prof){
      if (!prof) return;
      USER_ID = prof.userId;
      return loadAll();
    }).catch(function(){
      $("loading").textContent = "เปิดผ่านเมนูใน LINE เท่านั้น";
    });
  }

  function loadAll(){
    return Promise.all([
      call({ action: "getInspectFeed" }),
      call({ action: "getInspectStatus" })
    ]).then(function(arr){
      var feedRes = arr[0], statRes = arr[1];

      if (feedRes && feedRes.error === "FORBIDDEN") {
        $("loading").textContent = "หน้านี้สำหรับผู้ที่ได้รับสิทธิ์ดูผลตรวจเท่านั้น";
        return;
      }
      if ((!feedRes || !feedRes.ok) && (!statRes || !statRes.ok)) {
        $("loading").textContent = "โหลดไม่สำเร็จ ลองใหม่อีกครั้ง";
        return;
      }

      FEED_ALL = (feedRes && feedRes.feed) || [];
      renderFeed();
      renderStatus(statRes);

      $("loading").style.display = "none";
      $("content").style.display = "block";
    });
  }

  // ===== View 1 — ประวัติ =====
  function renderFeed(){
    var box = $("feed");
    if (!FEED_ALL.length) {
      box.innerHTML = '<div class="emptybox">ยังไม่มีประวัติการตรวจ</div>';
      $("feedTag").textContent = "";
      return;
    }
    $("feedTag").textContent = "ทั้งหมด " + FEED_ALL.length + " รอบ";

    var list = FEED_ALL.slice(0, FEED_SHOWN);
    var html = "";
    list.forEach(function(f, i){
      html +=
        '<div class="feedrow" data-i="' + i + '" data-id="' + esc(f.inspection_id) + '" ' +
             'onclick="toggleDetail(this.dataset.i, this.dataset.id)">' +
          '<div>' +
            '<div class="feed-date">' + esc(f.date_disp) + '</div>' +
            '<div class="feed-by">โดย ' + esc(f.name) + '</div>' +
            '<div class="feed-meta">' +
              '<span class="mp">✓ ' + f.pass_count + '</span>' +
              (f.fail_count ? '<span class="mf">✗ ' + f.fail_count + '</span>' : '') +
              (f.photo_count ? '<span class="mc">📷 ' + f.photo_count + '</span>' : '') +
            '</div>' +
          '</div>' +
          '<div class="feed-right">' +
            '<span class="branch-badge">' + esc(f.branch_name) + '</span>' +
            '<span class="caret" id="ca_' + i + '">▶</span>' +
          '</div>' +
        '</div>' +
        '<div class="detail" id="dt_' + i + '"></div>';
    });

    if (FEED_ALL.length > FEED_SHOWN) {
      html += '<button class="loadmore" onclick="moreFeed()">โหลดเพิ่ม (' +
              (FEED_ALL.length - FEED_SHOWN) + ' รอบ)</button>';
    }
    box.innerHTML = html;
  }

  function moreFeed(){ FEED_SHOWN += FEED_STEP; renderFeed(); }

  function toggleDetail(i, insId){
    var panel = $("dt_" + i), caret = $("ca_" + i);
    if (panel.classList.contains("open")) {
      panel.classList.remove("open");
      caret.classList.remove("open");
      return;
    }
    panel.classList.add("open");
    caret.classList.add("open");

    if (CACHE[insId]) { panel.innerHTML = detailHtml(CACHE[insId]); return; }

    panel.innerHTML = '<div class="dloading">กำลังโหลดรายละเอียด…</div>';
    call({ action: "getInspectDetail", inspection_id: insId }).then(function(res){
      if (!res || !res.ok) {
        panel.innerHTML = '<div class="dloading">โหลดรายละเอียดไม่สำเร็จ</div>';
        return;
      }
      CACHE[insId] = res;
      panel.innerHTML = detailHtml(res);
    }).catch(function(){
      panel.innerHTML = '<div class="dloading">โหลดรายละเอียดไม่สำเร็จ</div>';
    });
  }

  function detailHtml(d){
    var html = "";
    if (d.note) html += '<div class="dnote">📝 ' + esc(d.note) + '</div>';

    (d.items || []).forEach(function(it, n){
      html += '<div class="ditem' + (it.pass ? '' : ' fail') + '">' +
                '<div class="drow">' +
                  '<span class="dmark ' + (it.pass ? 'ok">✓' : 'no">✗') + '</span>' +
                  '<span class="dlabel">' + (n+1) + '. ' + esc(it.label) + '</span>' +
                '</div>';

      if (it.photos && it.photos.length) {
        html += '<div class="dphotos">';
        it.photos.forEach(function(u){
          // thumbnail endpoint โหลดเร็ว (เป็น <img> จริง) — ถ้าโหลดไม่ขึ้นจะสลับเป็นปุ่ม "ดูรูป" อัตโนมัติ
          html += '<button class="ph" data-u="' + esc(u) + '" onclick="openLb(this.dataset.u)">' +
                    '<img src="https://drive.google.com/thumbnail?id=' + esc(driveId(u)) + '&sz=w400" ' +
                         'onerror="thumbFail(this)">' +
                  '</button>';
        });
        html += '</div>';
      }
      html += '</div>';
    });
    return html;
  }

  // thumbnail โหลดไม่ขึ้น → เปลี่ยนปุ่มรูปเป็นปุ่มข้อความ (ยังกดดูรูปเต็มได้ผ่าน iframe เหมือนสลิปเงินเดือน)
  function thumbFail(img){
    var btn = img.parentNode;
    btn.className = "ph-fb";
    btn.textContent = "📷 ดูรูป";
  }

  function openLb(url){
    $("lbframe").src = url;
    $("lb").classList.add("open");
  }
  function closeLb(){
    $("lb").classList.remove("open");
    $("lbframe").src = "";
  }

  // ===== View 2 — สถานะเดือนนี้ =====
  function renderStatus(res){
    var box = $("status");
    if (!res || !res.ok) {
      box.innerHTML = '<div class="emptybox">โหลดสถานะไม่สำเร็จ</div>';
      return;
    }
    $("monthTag").textContent = res.month_disp || "";
    $("ctChecked").textContent = res.checked;
    $("ctMissed").textContent  = res.missed;

    var html = "";
    res.branches.forEach(function(b){
      if (b.inspected) {
        var chips = (b.dates || []).map(function(d){
          return '<span class="chip">' + esc(d) + '</span>';
        }).join("");
        html +=
          '<div class="brow ok">' +
            '<span class="bname">' + esc(b.branch_name) + '</span>' +
            '<span class="bright"><span class="bcount">' + b.count + ' ครั้ง</span>' + chips + '</span>' +
          '</div>';
      } else {
        html +=
          '<div class="brow no">' +
            '<span class="bname">' + esc(b.branch_name) + '</span>' +
            '<span class="bno">ยังไม่ตรวจ</span>' +
          '</div>';
      }
    });
    box.innerHTML = html;
  }

  init();
</script>
</body>
</html>
